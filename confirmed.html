<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email confirmed · My Car</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f16;color:#e8eef7;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
.c{padding:32px 24px;max-width:360px}.i{font-size:56px}h1{font-size:24px;margin:12px 0 8px}p{color:#9fb0c6;line-height:1.5}
.e{color:#ff8a8a}</style></head>
<body><div class="c" id="c"><div class="i">✅</div><h1>Email confirmed</h1>
<p>Your My Car account is ready. Go back to the app and tap <b>“I confirmed, continue”</b> (or sign in).</p></div>
<script>
// Supabase adds #error=... to the link if it expired or was already used.
var h = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
if (h.get('error')) document.getElementById('c').innerHTML = '<div class="i">⚠️</div><h1>Link expired</h1><p class="e">' +
  (h.get('error_description') || 'This link is no longer valid.').replace(/[<>]/g, '') +
  '</p><p>Open the app and tap “Send the email again”, or just sign in if you already confirmed.</p>';
</script></body></html>
